<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servidor de Pase de Lista - Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_laptop.css') }}">

</head>
<body>
    <h1 class="titulo_principal">Registro de asistencia</h1>
    <p>Estado de la red: <strong>Conectado y escuchando...</strong></p>

    <table>
        <thead>
            <tr>
                <th>Alumno</th>
                <th>Hora de Registro</th>
                <th>IP del Cliente</th>
            </tr>
        </thead>
        <tbody id="tabla-asistencia">
            <!-- Aquí irán apareciendo los registros automáticamente -->
        </tbody>
    </table>

    <script>
        // Conexión por WebSocket al servidor en la laptop
        const socket = io();

        socket.on('nueva_asistencia', function(registro) {
            const tbody = document.getElementById('tabla-asistencia');
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td><strong>${registro.nombre}</strong></td>
                <td>${registro.hora}</td>
                <td>${registro.ip_cliente}</td>
            `;
            tbody.prepend(fila); // Agrega al inicio de la lista
        });
    </script>
</body>
</html>
