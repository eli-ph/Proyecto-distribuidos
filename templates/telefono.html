<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Lista - Alumno</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_telefono.css') }}">
</head>
<body>
    <div class="card">
        <h2>Pase de Lista</h2>
        <p class="subtitle">Ingresa tu número de cuenta</p>
        
        <!-- Input para num de cuenta -->
        <input type="text" id="numCuenta" placeholder="Numero de cuenta" autocomplete="off">

        <button class="btn btn-success" onclick="marcarLlegada()">REGISTRAR ASISTENCIA</button>
        <button class="btn btn-info" onclick="consultarHistorial()">CONSULTAR MI HISTORIAL</button>
        
        <div id="respuesta"></div>
        <div id="estatusAlumno"></div>
    </div>

    <script>
        // Al escribir de nuevo, se borran los mensajes de la consulta anterior.
        document.getElementById('numCuenta').addEventListener('input', function () {
            document.getElementById('respuesta').innerText = '';
            document.getElementById('estatusAlumno').innerHTML = '';
        });

        async function marcarLlegada() {
            const cuenta = document.getElementById('numCuenta').value;
            const divRespuesta = document.getElementById('respuesta');

            if (!cuenta.trim()) {
                divRespuesta.innerText = "Por favor ingresa tu número de cuenta.";
                divRespuesta.style.color = "#f87171";
                return;
            }

            try {
                const res = await fetch('/api/asistencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero_de_cuenta: cuenta })
                });

                const data = await res.json();
                divRespuesta.innerText = data.mensaje;
                divRespuesta.style.color = data.status === 'ok' ? '#34d399' : '#f87171';
                
                if(data.status === 'ok') {
                    consultarHistorial();
                }
            } catch (error) {
                divRespuesta.innerText = "Error de conexión con el servidor.";
                divRespuesta.style.color = "#f87171";
            }
        }

        // Evita que un nombre con caracteres especiales rompa el HTML.
        function escaparHTML(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        async function consultarHistorial() {
            const cuenta = document.getElementById('numCuenta').value;
            const divEstatus = document.getElementById('estatusAlumno');

            if (!cuenta.trim()) {
                divEstatus.innerText = "Escribe tu número de cuenta arriba.";
                return;
            }

            try {
                const res = await fetch(`/api/historial/${encodeURIComponent(cuenta.trim())}`);
                const data = await res.json();

                if (!res.ok) {
                    divEstatus.innerText = data.mensaje || "No se pudo cargar el historial.";
                    return;
                }

                let html = `
                    <p style="margin: 0 0 8px 0;"><b>Alumno:</b> ${escaparHTML(data.alumno.nombre)}</p>
                    <p style="margin: 0 0 8px 0;"><b>Cuenta:</b> ${escaparHTML(data.alumno.numero_de_cuenta)}</p>
                `;

                if (data.clases.length === 0) {
                    html += `<p style="margin: 8px 0 0 0;">No estás inscrito en ninguna clase.</p>`;
                }

                // Un bloque por cada clase del alumno.
                for (const clase of data.clases) {
                    const r = clase.resumen;
                    html += `
                        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 12px 0;">
                        <p style="margin: 0 0 6px 0;"><b>${escaparHTML(clase.clase)}</b></p>
                        <p style="margin: 4px 0;">Asistencias: <span style="color: #34d399; font-weight: bold;">${r.asistencias}</span></p>
                        <p style="margin: 4px 0;">Retardos: <span style="color: #fbbf24; font-weight: bold;">${r.retardos}</span></p>
                        <p style="margin: 4px 0;">Faltas: <span style="color: #f87171; font-weight: bold;">${r.faltas}</span></p>
                        <p style="margin: 4px 0;">Porcentaje de asistencia: <b>${r.porcentaje} %</b></p>
                    `;
                }

                divEstatus.innerHTML = html;
            } catch (err) {
                divEstatus.innerText = "No se pudo cargar el historial.";
            }
        }
    </script>
</body>
</html>
